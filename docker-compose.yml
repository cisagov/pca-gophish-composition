

secrets:
  gophish_config_json:
    file: ./secrets/gophish/config.json
  gophish_admin_fullchain_pem:
    file: ./secrets/gophish/admin_fullchain.pem
  gophish_admin_privkey_pem:
    file: ./secrets/gophish/admin_privkey.pem
  gophish_phish_fullchain_pem:
    file: ./secrets/gophish/phish_fullchain.pem
  gophish_phish_privkey_pem:
    file: ./secrets/gophish/phish_privkey.pem
  postfix_fullchain_pem:
    file: ./secrets/postfix/fullchain.pem
  postfix_privkey_pem:
    file: ./secrets/postfix/privkey.pem
  postfix_users_txt:
    file: ./secrets/postfix/users.txt

services:
  gophish:
    image: cisagov/gophish:0.11.0-cisa.1
    init: true
    restart: always
    hostname: gophish
    environment:
      - PRIMARY_DOMAIN=example.com
      - RELAY_IP=172.16.202.0/24
    ports:
      - target: 3333
        published: 3333
        protocol: tcp
        mode: host
      - target: 8080
        published: 3380
        protocol: tcp
        mode: host
    secrets:
      - source: gophish_config_json
        target: config.json
      - source: gophish_admin_fullchain_pem
        target: admin_fullchain.pem
      - source: gophish_admin_privkey_pem
        target: admin_privkey.pem
      - source: gophish_phish_fullchain_pem
        target: phish_fullchain.pem
      - source: gophish_phish_privkey_pem
        target: phish_privkey.pem
    # FIX 1: Removed volume mapping for /opt/gophish. 
    # Because the DB lives next to the binary, you cannot easily map a host folder 
    # without hiding the binary. Use a "Named Volume" if you need DB persistence, 
    # or configure Gophish to write the DB to a specific /data folder.
    volumes:
       - ./volumes_data/gophish:/opt/gophish 

  gophish-tools:
    image: cisagov/gophish-tools:latest

  mailhog:
    image: mailhog/mailhog
    hostname: mailhog
    restart: always
    environment:
      - PRIMARY_DOMAIN=example.com
      - RELAY_IP=172.16.202.0/24
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    ports:
      - target: 8025
        published: 8025
        protocol: tcp
        mode: host
    volumes:
      - ./volumes_data/mailhog:/maildir

  postfix:
    image: cisagov/postfix:0.0.6
    hostname: postfix
    init: true
    restart: always
    environment:
      - PRIMARY_DOMAIN=example.com
      - RELAY_IP=172.16.202.0/24
    ports:
      - target: 25
        published: 1025
        protocol: tcp
        mode: host
      - target: 587
        published: 1587
        protocol: tcp
        mode: host
    secrets:
      - source: postfix_fullchain_pem
        target: fullchain.pem
      - source: postfix_privkey_pem
        target: privkey.pem
      - source: postfix_users_txt
        target: users.txt
    volumes:
      # FIX 2: Removed /etc mapping (this caused your crash).
      # FIX 3: Narrowed the spool mapping to just 'postfix' to be safe.
      # - ./volumes_data/postfix-spool:/var/spool/postfix
      - ./configs/postfix/main.cf:/etc/postfix/main.cf

  dovecot:
    image: dovecot/dovecot:latest
    hostname: dovecot
    init: true
    environment:
      - PRIMARY_DOMAIN=example.com
      - RELAY_IP=172.16.202.0/24
    ports:
      - target: 31143
        published: 8026 
        protocol: tcp
        mode: host
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
      - target: 8080
        published: 8029
        protocol: tcp
        mode: host
    volumes:
      # FIX 4: Removed /etc/dovecot mapping (would cause crash).
      - ./volumes_data/dovecot/mail:/var/lib/dovecot

  roundcube:
    image: robbertkl/roundcube
    hostname: roundcube
    init: true
    environment:
      - PRIMARY_DOMAIN=example.com
      - RELAY_IP=172.16.202.0/24
    ports:
      - target: 80
        published: 8030
        protocol: tcp
        mode: host
    volumes:
      - ./volumes_data/roundcube/db:/var/www/html/db

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.202.0/24

